<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARONA ARCHIVE | GACHA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gacha.css') }}">
</head>

<body>
    <div class="pearl-background">
        <div class="swoosh swoosh-1"></div>
    </div>

    <header class="header">
        <div class="header-left"><a href="/" class="logo">ARONA <span>ARCHIVE</span></a></div>
        <div class="header-center"><a href="/gacha" class="gacha-nav-btn">GACHA</a></div>
        <div class="header-right">
            <div class="pc-nav" style="display: flex; align-items: center; gap: 1rem;">
                <a href="/collection" class="tab-link">COLLECTION</a>
                <a href="/inventory" class="tab-link">INVENTORY</a>
                <div class="profile-container">
                    <div class="profile" style="padding: 4px 16px 4px 6px;" onclick="toggleProfileDropdown()">
                        <img src="{{ user.avatar_url }}" alt="profile">
                        <span>{{ user.username }}</span>
                    </div>
                    <div id="profileDropdown" class="profile-dropdown">
                        <a href="/logout">LOGOUT</a>
                    </div>
                </div>
            </div>
            <button class="hamburger-btn mobile-nav" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div id="mobile-menu" class="mobile-dropdown">
            <div class="mobile-profile"><img src="{{ user.avatar_url }}"><span>{{ user.username }}</span></div>
            <a href="/gacha" class="mobile-link gacha-link">GACHA</a>
            <a href="/collection" class="mobile-link">COLLECTION</a>
            <a href="/inventory" class="mobile-link">INVENTORY</a>
            <a href="/logout" class="mobile-link logout-link">LOGOUT</a>
        </div>
    </header>

    <main>
        <div class="point-display">
            보유 포인트: <strong id="current-points">{{ user_points }}</strong> P
        </div>

        <div class="gacha-control">
            <button class="gold-btn" onclick="performGacha(10)">10연차 (1,200P)</button>
        </div>

        <div id="gacha-deck" class="gacha-grid">
            <div class="empty-state">버튼을 눌러 모집을 시작하세요!</div>
        </div>
    </main>

    <!-- Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <div id="owned-data" data-owned='{{ owned_names | tojson | safe }}' style="display:none;"></div>
    <script src="{{ url_for('static', filename='js/gacha.js') }}"></script>
    <script>
        function showModal(src) {
            document.getElementById('imageModal').style.display = "flex";
            document.getElementById('modalImg').src = src;
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.querySelector('.hamburger-btn');
            menu.classList.toggle('active');
            btn.classList.toggle('open');
            if (menu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        // 프로필 클릭 시 로그아웃 드롭다운 토글
        function toggleProfileDropdown() {
            document.getElementById('profileDropdown').classList.toggle('active');
        }
    </script>
</body>

</html>
