<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARONA ARCHIVE | PREMIUM</title>
    <style>
        @font-face {
            font-family: 'NexonLv2';
            src: url('/static/fonts/NEXON Lv2 Gothic Light.ttf') format('truetype');
            font-weight: 300;
        }

        @font-face {
            font-family: 'NexonLv2';
            src: url('/static/fonts/NEXON Lv2 Gothic.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'NexonLv2';
            src: url('/static/fonts/NEXON Lv2 Gothic Medium.ttf') format('truetype');
            font-weight: 500;
        }

        @font-face {
            font-family: 'NexonLv2';
            src: url('/static/fonts/NEXON Lv2 Gothic Bold.ttf') format('truetype');
            font-weight: 700;
        }

        /* [PREMIUM DARK & PEARL THEME] */
        :root {
            --bg-deep: #0a0a0c;
            --bg-surface: rgba(20, 20, 23, 0.7);
            --header-glass: rgba(10, 10, 12, 0.85);
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --accent-red: #ef4444;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            /* ✨ 폰트 적용: 넥슨 고딕을 1순위로 박아버림 */
            font-family: 'NexonLv2', sans-serif;
            margin: 0;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* [BACKGROUND SWOOSH] */
        .pearl-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-deep);
        }

        .swoosh {
            position: absolute;
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .swoosh-1 {
            width: 120vw;
            height: 60vh;
            top: -15%;
            right: -20%;
            background: radial-gradient(ellipse, var(--accent-blue), transparent 70%);
            transform: rotate(-15deg) skewX(-20deg);
            animation: flow 25s infinite alternate ease-in-out;
        }

        .swoosh-2 {
            width: 100vw;
            height: 80vh;
            bottom: -25%;
            left: -15%;
            background: radial-gradient(ellipse, #7c3aed, transparent 70%);
            transform: rotate(10deg);
            animation: flow 30s infinite alternate-reverse ease-in-out;
        }

        @keyframes flow {
            0% {
                transform: rotate(-15deg) translate(0, 0);
                opacity: 0.12;
            }

            100% {
                transform: rotate(-10deg) translate(-3%, 3%);
                opacity: 0.2;
            }
        }

        /* [HEADER] */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: var(--header-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: inherit;
        }

        .logo span {
            color: var(--accent-blue);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* [TITLE & FILTER] */
        .title-section {
            padding: 70px 50px 20px 50px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent-blue) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-top: 12px;
            font-size: 1rem;
            opacity: 0.7;
            font-weight: 300;
        }

        .filter-container {
            padding: 0 50px 30px 50px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-family: 'NexonLv2', sans-serif;
        }

        .filter-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* [CARD GRID] */
        #deck {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 35px;
            padding: 40px 50px;
        }

        .card {
            background: var(--bg-surface);
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid var(--border-color);
            position: relative;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .card-name {
            font-size: 1.05rem;
            font-weight: 500;
            color: #fff;
        }

        .card-status {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ... 나머지 스타일은 니가 쓰던 거랑 똑같다 ... */
        .card:not(.is-hidden):hover {
            transform: translateY(-12px);
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: #000;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: 0.7s;
        }

        .is-hidden {
            opacity: 0.5;
            filter: saturate(0.5);
        }

        .is-hidden img {
            opacity: 0.25;
            filter: blur(2px);
        }

        .card-info {
            padding: 25px 20px 20px 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .status-owned {
            color: var(--accent-blue);
        }

        .status-locked {
            color: var(--text-secondary);
        }

        #cardModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            backdrop-filter: blur(20px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #cardModal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            position: relative;
            max-width: 420px;
            width: 90%;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-img {
            width: 100%;
            border-radius: 32px;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 60px var(--accent-glow);
        }

        .modal-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .close-btn {
            position: absolute;
            top: -60px;
            right: 0;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            opacity: 0.6;
        }

        /* [RESPONSIVE] */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            #deck {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 20px 15px;
            }

            .card-name {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <div class="pearl-background">
        <div class="swoosh swoosh-1"></div>
        <div class="swoosh swoosh-2"></div>
    </div>

    <header class="header">
        <div class="header-left">
            <a href="/" class="logo">ARONA <span>ARCHIVE</span></a>
            <div class="nav-links">
                <a href="/logout" class="nav-btn logout">LOGOUT</a>
            </div>
        </div>
        <div class="header-right">
            <div class="profile">
                <span>{{ user.username }}</span>
                <img src="{{ user.avatar_url }}" alt="profile">
            </div>
        </div>
    </header>

    <main>
        <div class="title-section">
            <h1>Collection</h1>
            <p class="subtitle">선생님께서 수집하신 카드들이에요!</p>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCards('all', this)">ALL</button>
            <button class="filter-btn" onclick="filterCards('normal', this)">NORMAL</button>
            <button class="filter-btn" onclick="filterCards('rare', this)">RARE</button>
            <button class="filter-btn" onclick="filterCards('super_rare', this)">SR</button>
            <button class="filter-btn" onclick="filterCards('ultra_rare', this)">UR</button>
        </div>

        <div id="deck">
            {% for card in all_cards %}
            {% set is_owned = card.name in owned_names %}
            <div class="card {% if not is_owned %}is-hidden{% endif %}"
                data-img="{{ ('/images/' ~ card.path) if is_owned else '/images/hidden.jpg' }}"
                data-name="{{ card.name if is_owned else 'Locked' }}" data-grade="{{ card.grade }}"
                data-owned="{{ 'true' if is_owned else 'false' }}" onclick="openModal(this)">
                <div class="card-img-wrapper">
                    <img src="{% if is_owned %}/images/{{ card.path }}{% else %}/images/hidden.jpg{% endif %}"
                        alt="{{ card.name }}">
                </div>
                <div class="card-info">
                    <div class="card-name">{% if is_owned %}{{ card.name }}{% else %}Locked{% endif %}</div>
                    <div class="card-status">
                        {% if is_owned %}<span class="status-owned">● Owned</span>{% else %}<span
                            class="status-locked">○ Not Owned</span>{% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <div id="cardModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-img" src="">
            <div class="modal-info">
                <div id="modalName" class="modal-name"></div>
                <div id="modalStatus" class="card-status status-owned"></div>
            </div>
        </div>
    </div>

    <script>
        function filterCards(grade, btnElement) {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const cardGrade = card.getAttribute('data-grade');
                if (grade === 'all' || cardGrade === grade) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        const modal = document.getElementById('cardModal');
        function openModal(cardElement) {
            const isOwned = cardElement.dataset.owned === 'true';
            document.getElementById('modalImg').src = cardElement.dataset.img;
            document.getElementById('modalName').innerText = cardElement.dataset.name;
            const modalStatus = document.getElementById('modalStatus');
            modalStatus.innerText = isOwned ? "● OWNED" : "○ LOCKED";
            modalStatus.className = isOwned ? "card-status status-owned" : "card-status status-locked";
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('active'); }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
            document.body.style.overflow = 'auto';
        }
        window.onkeydown = function (event) { if (event.keyCode === 27) closeModal(); };
    </script>
</body>

</html>
